[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".git",
    ".idea",
    ".venv",
    "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
pretty = true
